<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUANTUM ECHO ANALYZER // PRO-SPEC</title>
    <style>
        :root {
            --neon-green: #00ff66;
            --alert-red: #ff3333;
            --bg-dark: #08080a;
            --panel-bg: rgba(12, 16, 12, 0.75);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-dark);
            font-family: 'Courier New', Courier, monospace;
            color: var(--neon-green);
            overflow: hidden;
            user-select: none;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 15px;
            justify-content: space-between;
        }

        header {
            border-bottom: 2px dashed var(--neon-green);
            padding-bottom: 8px;
            font-weight: bold;
        }

        .title {
            font-size: 1.1rem;
            margin: 0;
            letter-spacing: 1px;
        }

        #status-display {
            font-size: 0.8rem;
            opacity: 0.8;
            display: block;
            margin-top: 3px;
        }

        #screen-matrix {
            flex-grow: 1;
            margin: 15px 0;
            border: 1px solid var(--neon-green);
            background: radial-gradient(circle, rgba(0,30,5,0.3) 0%, rgba(0,0,0,1) 85%);
            position: relative;
            box-shadow: inset 0 0 20px rgba(0, 255, 102, 0.2);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .telemetry-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .panel {
            border: 1px solid var(--neon-green);
            background: var(--panel-bg);
            padding: 12px;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 2px;
            background: var(--neon-green);
            opacity: 0.3;
        }

        .panel-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
        }

        .panel-value {
            font-size: 1.6rem;
            font-weight: bold;
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }

        #terminal-log {
            height: 75px;
            border: 1px solid var(--neon-green);
            background: rgba(0, 0, 0, 0.9);
            padding: 8px;
            font-size: 0.7rem;
            overflow: hidden;
            line-height: 1.4;
        }

        .log-entry {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-core {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 16px;
            font-family: inherit;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            margin-top: 15px;
        }

        .btn-core:active {
            background: var(--neon-green);
            color: var(--bg-dark);
            box-shadow: 0 0 20px var(--neon-green);
        }

        /* HARDWARE ANOMALY STATE - TRIGGERED VIA JS */
        .hardware-alert {
            animation: core-glitch 0.15s infinite !important;
            color: var(--alert-red) !important;
            border-color: var(--alert-red) !important;
        }

        @keyframes core-glitch {
            0% { background-color: rgba(255, 50, 50, 0.15); box-shadow: inset 0 0 15px rgba(255,0,0,0.3); }
            50% { background-color: rgba(0, 0, 0, 0); box-shadow: none; }
            100% { background-color: rgba(255, 50, 50, 0.08); box-shadow: inset 0 0 10px rgba(255,0,0,0.2); }
        }
    </style>
</head>
<body>

<div id="app-container">
    <header id="app-header">
        <p class="title">MATRIX SPECTRAL ANALYZER // ARCH-v2.6</p>
        <span id="status-display">CORE STATUS: STABLE_IDLE</span>
    </header>

    <div id="screen-matrix">
        <canvas id="radar-canvas"></canvas>
    </div>

    <div class="telemetry-grid">
        <div class="panel" id="panel-emf">
            <div class="panel-label">EM Field Variance (EMF)</div>
            <div class="panel-value" id="val-emf">0.00 <span style="font-size: 0.8rem;">µT</span></div>
        </div>
        <div class="panel" id="panel-evp">
            <div class="panel-label">Acoustic Resonance (EVP)</div>
            <div class="panel-value" id="val-evp">0.00 <span style="font-size: 0.8rem;">Hz</span></div>
        </div>
    </div>

    <div id="terminal-log"></div>

    <button class="btn-core" id="btn-trigger">Inizializza Scansione Spettrale</button>
</div>

<script>
/**
 * ENGINE CORE - QUANTUM SPECTRUM ANALYZER
 * Progettato per massime prestazioni hardware in JavaScript puro (Vanilla ES6).
 */
class QuantumAnalyzer {
    constructor() {
        // Mappatura DOM cacheata (nessuna query ripetuta nel loop)
        this.dom = {
            btn: document.getElementById('btn-trigger'),
            header: document.getElementById('app-header'),
            status: document.getElementById('status-display'),
            log: document.getElementById('terminal-log'),
            emfVal: document.getElementById('val-emf'),
            evpVal: document.getElementById('val-evp'),
            emfPanel: document.getElementById('panel-emf'),
            evpPanel: document.getElementById('panel-evp'),
            canvas: document.getElementById('radar-canvas')
        };

        // Parametri di calcolo e soglie hardware
        this.config = {
            emfThreshold: 6.5,
            evpThreshold: 45.0,
            fusionCritical: 55
        };

        // Allocazione statica degli stati (Previene l'attivazione del Garbage Collector)
        this.state = {
            isActive: false,
            emfCurrent: 42.50,
            emfBaseline: 42.50,
            evpCurrentFreq: 0,
            ghostProbability: 0,
            radarAngle: 0
        };

        // Audio API Context Lazy Variables
        this.audioCtx = null;
        this.analyser = null;
        this.audioDataBuffer = null;
        this.ctx = this.dom.canvas.getContext('2d', { alpha: false }); // Ottimizzazione rendering context hardware

        this.initEvents();
    }

    initEvents() {
        this.dom.btn.addEventListener('click', () => this.bootEngine());
        window.addEventListener('resize', () => this.resizeCanvas());
        this.resizeCanvas();
        this.writeLog("System core pronto per l'accoppiamento hardware.");
    }

    resizeCanvas() {
        this.dom.canvas.width = this.dom.canvas.parentElement.clientWidth;
        this.dom.canvas.height = this.dom.canvas.parentElement.clientHeight;
    }

    writeLog(message) {
        const timestamp = new Date().toTimeString().split(' ')[0];
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        entry.innerHTML = `[${timestamp}] > ${message}`;
        this.dom.log.insertBefore(entry, this.dom.log.firstChild);
        
        // Mantieni pulita la memoria del DOM rimuovendo i vecchi nodi log
        if (this.dom.log.childNodes.length > 4) {
            this.dom.log.removeChild(this.dom.log.lastChild);
        }
    }

    async bootEngine() {
        if (this.state.isActive) return;

        this.dom.btn.style.display = 'none';
        this.dom.status.innerText = "CORE STATUS: COUPLING_HARDWARE...";
        
        // 1. Pipeline Audio Nativa (EVP)
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            this.analyser = this.audioCtx.createAnalyser();
            this.analyser.fftSize = 64; // Estremamente veloce per campionamenti real-time
            
            const source = this.audioCtx.createMediaStreamSource(stream);
            source.connect(this.analyser);
            
            this.audioDataBuffer = new Uint8Array(this.analyser.frequencyBinCount);
            this.writeLog("Iniezione stream audio a FFT riuscita.");
        } catch (err) {
            this.writeLog("RESTRIZIONE AUDIO: Attivato algoritmo di ricostruzione passiva.");
        }

        // 2. Pipeline Magnetica Nativa (EMF) con Fallback Integrato
        let hasHardwareMag = false;
        if ('Magnetometer' in window) {
            try {
                const magSensor = new Magnetometer({ frequency: 30 });
                magSensor.addEventListener('reading', () => {
                    hasHardwareMag = true;
                    const magVect = Math.sqrt(magSensor.x**2 + magSensor.y**2 + magSensor.z**2);
                    this.state.emfCurrent = parseFloat(magVect.toFixed(2));
                });
                magSensor.start();
                this.writeLog("Sensore Magnetico ad accoppiamento diretto online.");
            } catch (e) {
                hasHardwareMag = false;
            }
        }

        // Sgancio del Fallback Sensor-Fusion se l'hardware nativo è limitato dalle Sandbox dei browser
        setTimeout(() => {
            if (!hasHardwareMag) {
                this.writeLog("Aggancio software sussidiario su Device-Orientation API.");
                this.bindFallbackSensors();
            }
        }, 500);

        this.state.isActive = true;
        this.dom.status.innerText = "CORE STATUS: ACTIVE_SCANNING";
        
        // Start dell'High Performance Render Loop
        requestAnimationFrame(() => this.engineLoop());
    }

    bindFallbackSensors() {
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().catch(() => {});
        }

        window.addEventListener('deviceorientation', (event) => {
            // Fusione dinamica dei vettori di rotazione spaziale per simulare micro-sbalzi del campo magnetico locale
            const dynamicVector = Math.abs(event.alpha || 0) + Math.abs(event.beta || 0) + Math.abs(event.gamma || 0);
            const stabilizationFactor = (Math.random() - 0.5) * 0.9;
            this.state.emfCurrent = parseFloat((41.2 + (dynamicVector % 8) + stabilizationFactor).toFixed(2));
        });
    }

    /**
     * ENGINE LOOP (60 FRAME PER SECONDO)
     * Calcolo matematico deterministico ad alte prestazioni.
     */
    engineLoop() {
        if (!this.state.isActive) return;

        // --- 1. PROCESSO SEGNALE AUDIO (EVP) ---
        let audioEnergy = 0;
        if (this.analyser) {
            this.analyser.getByteFrequencyData(this.audioDataBuffer);
            let energySum = 0;
            const len = this.audioDataBuffer.length;
            for (let i = 0; i < len; i++) {
                energySum += this.audioDataBuffer[i];
            }
            audioEnergy = energySum / len;
            this.state.evpCurrentFreq = parseFloat((audioEnergy * 4.2).toFixed(1));
        } else {
            // Algoritmo stocastico di rumore d'ambiente a bassa frequenza
            this.state.evpCurrentFreq = parseFloat((15.0 + Math.random() * 5 + Math.sin(Date.now() / 250) * 3).toFixed(1));
            audioEnergy = this.state.evpCurrentFreq / 4.2;
        }

        // --- 2. AGGIORNAMENTO TELEMETRIA INTERFACCIA ---
        this.dom.emfVal.innerHTML = `${this.state.emfCurrent} <span style="font-size: 0.8rem;">µT</span>`;
        this.dom.evpVal.innerHTML = `${this.state.evpCurrentFreq} <span style="font-size: 0.8rem;">Hz</span>`;

        // --- 3. ALGORITMO DI SENSOR FUSION QUANTISTICA ---
        if (this.state.emfBaseline === 42.50 && this.state.emfCurrent !== 42.50) {
            this.state.emfBaseline = this.state.emfCurrent; 
        }
        const deltaEmf = Math.abs(this.state.emfCurrent - this.state.emfBaseline);

        // Calcolo probabilistico dell'indice di traccia spettrale
        this.state.ghostProbability = Math.min(100, Math.floor((deltaEmf * 4.5) + (audioEnergy * 0.9)));

        // --- 4. GESTIONE REAL-TIME DELLE ANOMALIE DI SISTEMA ---
        const isEmfCritical = deltaEmf > this.config.emfThreshold;
        const isEvpCritical = audioEnergy > this.config.evpThreshold;
        const isSystemCritical = this.state.ghostProbability > this.config.fusionCritical;

        if (isEmfCritical || isEvpCritical || isSystemCritical) {
            this.dom.header.classList.add('hardware-alert');
            this.dom.status.innerText = `CORE STATUS: ANOMALY_DETECTED (${this.state.ghostProbability}%)`;
            
            this.dom.emfPanel.classList.toggle('hardware-alert', isEmfCritical);
            this.dom.evpPanel.classList.toggle('hardware-alert', isEvpCritical);

            if (Math.random() > 0.94) {
                this.writeLog(`⚠️ WARN: Fluttuazione d'onda critica rilevata sul vettore energetico.`);
                if (navigator.vibrate) navigator.vibrate(80); // Feedback aptico hardware
            }
        } else {
            this.dom.header.classList.remove('hardware-alert');
            this.dom.emfPanel.classList.remove('hardware-alert');
            this.dom.evpPanel.classList.remove('hardware-alert');
            this.dom.status.innerText = "CORE STATUS: ACTIVE_SCANNING...";
        }

        // --- 5. EXECUTE PIPELINE RENDERING SU CANVAS VIA GPU ---
        this.renderRadarFrame(audioEnergy, deltaEmf);

        // Ricorsione controllata tramite V-Sync hardware del browser
        requestAnimationFrame(() => this.engineLoop());
    }

    /**
     * VECTOR RADAR RENDER PIPELINE
     * Gestione diretta del Canvas con buffer d'onda persistente.
     */
    renderRadarFrame(audioEnergy, deltaEmf) {
        // Effetto persistenza fosfori accoppiato alla GPU tramite fill alpha costante
        this.ctx.fillStyle = 'rgba(8, 8, 10, 0.18)';
        this.ctx.fillRect(0, 0, this.dom.canvas.width, this.dom.canvas.height);

        const cx = this.dom.canvas.width / 2;
        const cy = this.dom.canvas.height / 2;
        const radius = Math.min(cx, cy) * 0.88;

        // Disegno Griglia Circolare Geometrica
        this.ctx.strokeStyle = 'rgba(0, 255, 102, 0.12)';
        this.ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
            this.ctx.beginPath();
            this.ctx.arc(cx, cy, (radius / 3) * i, 0, Math.PI * 2);
            this.ctx.stroke();
        }

        // Calcolo e rotazione dell'angolo sweep del radar continuo
        this.state.radarAngle = (Date.now() / 700) % (Math.PI * 2);
        
        this.ctx.strokeStyle = 'rgba(0, 255, 102, 0.25)';
        this.ctx.beginPath();
        this.ctx.moveTo(cx, cy);
        this.ctx.lineTo(cx + Math.cos(this.state.radarAngle) * radius, cy + Math.sin(this.state.radarAngle) * radius);
        this.ctx.stroke();

        // SEZIONE RENDERING ECO: Generazione particellare se l'indice supera la barriera di rumore
        if (this.state.ghostProbability > 20) {
            this.ctx.save();
            
            // Mutazione cromatica della traccia in base alla severità dell'anomalia
            const isAlert = this.state.ghostProbability > this.config.fusionCritical;
            this.ctx.fillStyle = isAlert ? 'rgba(255, 51, 51, 0.45)' : 'rgba(0, 255, 102, 0.35)';
            
            // Algoritmo di mappatura spaziale basato su sfasamento dell'angolo d'onda
            const targetDistance = radius * (0.4 + (audioEnergy / 180));
            const driftAngle = this.state.radarAngle - 0.25;

            const traceX = cx + Math.cos(driftAngle) * (targetDistance + (deltaEmf * 1.5));
            const traceY = cy + Math.sin(driftAngle) * (targetDistance + (deltaEmf * 1.5));

            // Disegno dell'eco quantistico con distorsione dimensionale variabile
            this.ctx.beginPath();
            const blobSize = 4 + (this.state.ghostProbability / 5.5) + Math.sin(Date.now() / 50) * 3;
            this.ctx.arc(traceX, traceY, blobSize, 0, Math.PI * 2);
            this.ctx.fill();
            
            this.ctx.restore();
        }
    }
}

// Inizializzazione immediata all'avvio della pagina
window.addEventListener('DOMContentLoaded', () => {
    new QuantumAnalyzer();
});
</script>

</body>
</html>
